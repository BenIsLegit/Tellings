[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
strip = true
